<!DOCTYPE html>
<!-- ============================================================================
  VERSI SATU BERKAS (untuk pemula): CSS & JavaScript sudah digabung di sini.
  Cukup upload BERKAS INI + folder "assets/" ke hosting statis yang sama,
  lalu edit objek CONFIG di bagian <script> di bawah untuk kustomisasi.
  (Versi 3 berkas: index.html + style.css + script.js juga tersedia.)
============================================================================ -->
<!-- ============================================================================
  💌 GET TO KNOW US — Landing Page "Dating & Social Connection"
  ----------------------------------------------------------------------------
  Pemilik website: SELURUH pengaturan (teks, video, nomor WhatsApp, Telegram,
  warna, animasi) diatur dari SATU tempat: objek CONFIG di file script.js.
  File ini tidak perlu diubah untuk pengaturan dasar.

  Struktur file (siap upload ke hosting statis apa pun):
    index.html              → struktur halaman (file ini)
    style.css               → desain & responsivitas
    script.js               → CONFIG + logika background/animasi/tautan
    assets/                 → gambar cadangan, avatar ilustrasi, favicon
============================================================================ -->
